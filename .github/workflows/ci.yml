# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds, tests and signs Positioning Info on every push to main, every pull request and on
# demand (Run workflow). Mirrors the ZoneCraft pipeline.
#
# Steps, in increasing cost:
#   1. unit tests                       — the pure domain logic (diagnosis, decoders, maths)
#   2. lint                             — above all NewApi: a call newer than minSdk without
#                                         a version check crashes only on old phones
#   3. a *release* build, APK and AAB   — R8 shrinking only happens in release, so a break
#                                         there would otherwise surface on the phone; the
#                                         bundle (AAB) is what Google Play takes, the APK is
#                                         for installing directly
#   4. signed with the upload key       — Gradle falls back to an unsigned build silently
#                                         without the key, so a missing or debug signature
#                                         fails the run
#   5. keep the signed APK and AAB      — artifact positioning-info-<sha>, 30 days
#   6. tag the commit build-<code>      — on main only, the APK's versionCode, so every
#                                         distributed build maps to its exact source (the
#                                         AGPL's corresponding-source requirement); a code
#                                         not above the last tag fails the run, since Play
#                                         would refuse it
#
# Three repository secrets make the release build the installable one. They mirror files
# that live outside version control, so rotating either side means rotating both:
#   ANDROID_KEYSTORE_BASE64    <- ~/positioninginfo-upload-keystore.jks, base64
#   ANDROID_KEYSTORE_PASSWORD  <- keystore.properties (storePassword)
#   ANDROID_KEY_PASSWORD       <- keystore.properties (keyPassword)
# The alias `upload` is a literal, not a secret: GitHub masks every occurrence of a secret's
# value in the log.
#
# A fork's pull request sees no secrets. Every step marked `if: env.HAVE_KEYSTORE` is then
# skipped and the unsigned release build is only a smoke test — deliberately not uploaded.
# Never switch this to `pull_request_target`: it would hand the key to code a fork controls.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access only to push the release tag; a fork's pull request still gets a
    # read-only token whatever this says.
    permissions:
      contents: write

    # The `secrets` context cannot be read in a step's `if:`; an env var can.
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      # A shallow clone is enough: versionCode is HEAD's commit time (app/build.gradle.kts).
      - uses: actions/checkout@v4

      # 21 because that is the JDK that builds this project on the laptop; the bytecode
      # target is 17 either way (app/build.gradle.kts).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintRelease

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Version
        run: |
          read -r name code <<< "$(./gradlew --no-daemon -q printVersion | tail -1)"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName $name, versionCode $code"

      # Materialise what app/build.gradle.kts reads. storeFile resolves relative to app/;
      # both files are gitignored (*.jks, keystore.properties) and live only in this run.
      - name: Release signing
        if: env.HAVE_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=upload"
          } > keystore.properties

      - name: Release build
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      # An APK carries a v2/v3 signature that only apksigner reads.
      - name: Signed with the upload key, not debug
        if: env.HAVE_KEYSTORE != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          desc="$("$apksigner" verify --print-certs "$apk")"
          echo "$desc" | grep -E 'DN:|SHA-256' || true
          if [ -z "$desc" ]; then echo "!!! no signing certificate" >&2; exit 1; fi
          if echo "$desc" | grep -q 'CN=Android Debug'; then echo "!!! signed with the debug key" >&2; exit 1; fi
          # The bundle carries a JAR signature, which keytool reads.
          aab=app/build/outputs/bundle/release/app-release.aab
          cert="$(keytool -printcert -jarfile "$aab")"
          echo "$cert" | grep -E 'Owner:|SHA256:' || true
          if [ -z "$cert" ] || echo "$cert" | grep -q 'Not a signed jar'; then echo "!!! bundle not signed" >&2; exit 1; fi
          if echo "$cert" | grep -q 'CN=Android Debug'; then echo "!!! bundle signed with the debug key" >&2; exit 1; fi

      - name: Name the builds after their version
        if: env.HAVE_KEYSTORE != ''
        run: |
          mkdir -p dist
          base="dist/positioning-info-$VERSION_NAME-$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk "$base.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$base.aab"
          # R8's mapping, to read obfuscated stack traces; the bundle carries it to Play too.
          cp app/build/outputs/mapping/release/mapping.txt "$base-mapping.txt"

      - name: Keep the signed build
        if: env.HAVE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: positioning-info-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Only for signed builds of main: those are the APKs that get installed.
      - name: Tag the release
        if: env.HAVE_KEYSTORE != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="build-$VERSION_CODE"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            last="$(git ls-remote --tags origin 'refs/tags/build-*' | sed 's|.*refs/tags/build-||' | sort -n | tail -1)"
            if [ -n "$last" ] && [ "$VERSION_CODE" -le "$last" ]; then
              echo "!!! versionCode $VERSION_CODE is not above the last build ($last); Play would refuse it" >&2
              exit 1
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "tagged $tag"
          fi

      # The runner is discarded afterwards, but the key should not outlive the step that
      # needed it even there.
      - name: Remove the key
        if: always()
        run: rm -f app/upload-keystore.jks keystore.properties
