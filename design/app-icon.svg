<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- Source of the app icon (Positioning Info). The Android layers in res/drawable/ic_launcher_* are generated from this drawing. -->
  <rect width="108" height="108" fill="#000000"/>
  <g transform="translate(54 55) scale(0.74) translate(-54 -55)">
  <!-- signal paths to the phone -->
  <line x1="37" y1="38" x2="47" y2="50" stroke="#6FB7FF" stroke-opacity="0.7" stroke-width="1.8" stroke-dasharray="2.6 2.4" stroke-linecap="round"/>
  <line x1="71" y1="41" x2="62" y2="51" stroke="#EDEDED" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="2.6 2.4" stroke-linecap="round"/>
  <!-- satellite: body and two solar panels, tilted -->
  <g transform="rotate(-35 32 32)">
    <rect x="29" y="28.5" width="6" height="7" rx="1" fill="#6FB7FF"/>
    <rect x="19" y="29.5" width="8.5" height="5" rx="0.8" fill="none" stroke="#6FB7FF" stroke-width="1.6"/>
    <rect x="36.5" y="29.5" width="8.5" height="5" rx="0.8" fill="none" stroke="#6FB7FF" stroke-width="1.6"/>
  </g>
  <!-- cell tower: mast with cross bracing and two waves -->
  <g stroke="#EDEDED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M77 30 L72 46 M77 30 L82 46 M73.6 41 L80.4 41 M75 35.5 L79 35.5"/>
    <path d="M71.5 26.5 a7 7 0 0 0 0 7" stroke-opacity="0.6"/>
    <path d="M82.5 26.5 a7 7 0 0 1 0 7" stroke-opacity="0.6"/>
  </g>
  <circle cx="77" cy="29" r="1.8" fill="#EDEDED"/>
  <!-- phone -->
  <rect x="43" y="48" width="22" height="36" rx="4.5" fill="#000000" stroke="#EDEDED" stroke-width="2.4"/>
  <line x1="51" y1="52.5" x2="57" y2="52.5" stroke="#5A5A5A" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="54" cy="66" r="6.5" fill="none" stroke="#5ED39A" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="54" cy="66" r="3.4" fill="#5ED39A"/>
  </g>
</svg>
