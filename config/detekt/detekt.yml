# Detekt rules on top of the defaults. Every deviation is explained where it is made; the aim
# is code a reader understands without its author, not a number to satisfy.

naming:
  FunctionNaming:
    # Composables are named like types (SpeedScreen): the Compose convention.
    ignoreAnnotated: ['Composable']

style:
  ReturnCount:
    # Early returns that reject input up front (guard clauses) make a function easier to
    # follow, not harder; the rule counts the others.
    excludeGuardClauses: true
  MagicNumber:
    # Layout sizes (12.dp, 0.55f alpha) inside composables are the design itself; naming each
    # would only move it away from where it is used. Numbers in logic get names.
    ignoreAnnotated: ['Composable']
    # A property or enum entry already names its number.
    ignorePropertyDeclaration: true
    ignoreEnums: true

comments:
  # Every public class and function says what it is for: the app is maintained by reading it.
  UndocumentedPublicClass:
    active: true
    # A plain `companion object` holds the class's factories and constants; those are
    # documented themselves, the wrapper needs no sentence of its own.
    ignoreDefaultCompanionObject: true
  UndocumentedPublicFunction:
    active: true

complexity:
  CyclomaticComplexMethod:
    # A flat `when` that maps one value to another is a table, not branching logic.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # Counts what a class offers, not how finely it is split up inside: private helpers
    # that break a long method into named steps are what the length rules ask for.
    ignorePrivate: true
    ignoreOverridden: true
